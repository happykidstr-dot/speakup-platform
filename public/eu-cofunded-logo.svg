<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- White Background Box -->
  <rect width="240" height="240" rx="12" fill="#FFFFFF"/>
  <!-- Blue Flag Background -->
  <rect x="20" y="20" width="200" height="134" fill="#003399"/>
  <!-- 12 Yellow Stars in Circle -->
  <g transform="translate(120, 87)" fill="#FFCC00">
    <!-- Star 1 (12 o'clock) -->
    <polygon points="0,-42 3,-33 12,-33 5,-28 8,-19 0,-24 -8,-19 -5,-28 -12,-33 -3,-33"/>
    <!-- Star 2 (1 o'clock) -->
    <polygon points="21,-36.3 24,-27.3 33,-27.3 26,-22.3 29,-13.3 21,-18.3 13,-13.3 16,-22.3 9,-27.3 18,-27.3"/>
    <!-- Star 3 (2 o'clock) -->
    <polygon points="36.3,-21 39.3,-12 48.3,-12 41.3,-7 44.3,2 36.3,-3 28.3,2 31.3,-7 24.3,-12 33.3,-12"/>
    <!-- Star 4 (3 o'clock) -->
    <polygon points="42,0 45,9 54,9 47,14 50,23 42,18 34,23 37,14 30,9 39,9"/>
    <!-- Star 5 (4 o'clock) -->
    <polygon points="36.3,21 39.3,30 48.3,30 41.3,35 44.3,44 36.3,39 28.3,44 31.3,35 24.3,30 33.3,30"/>
    <!-- Star 6 (5 o'clock) -->
    <polygon points="21,36.3 24,45.3 33,45.3 26,50.3 29,59.3 21,54.3 13,59.3 16,50.3 9,45.3 18,45.3"/>
    <!-- Star 7 (6 o'clock) -->
    <polygon points="0,42 3,51 12,51 5,56 8,65 0,60 -8,65 -5,56 -12,51 -3,51"/>
    <!-- Star 8 (7 o'clock) -->
    <polygon points="-21,36.3 -18,45.3 -9,45.3 -16,50.3 -13,59.3 -21,54.3 -29,59.3 -26,50.3 -33,45.3 -24,45.3"/>
    <!-- Star 9 (8 o'clock) -->
    <polygon points="-36.3,21 -33.3,30 -24.3,30 -31.3,35 -28.3,44 -36.3,39 -44.3,44 -41.3,35 -48.3,30 -39.3,30"/>
    <!-- Star 10 (9 o'clock) -->
    <polygon points="-42,0 -39,9 -30,9 -37,14 -34,23 -42,18 -50,23 -47,14 -54,9 -45,9"/>
    <!-- Star 11 (10 o'clock) -->
    <polygon points="-36.3,-21 -33.3,-12 -24.3,-12 -31.3,-7 -28.3,2 -36.3,-3 -44.3,2 -41.3,-7 -48.3,-12 -39.3,-12"/>
    <!-- Star 12 (11 o'clock) -->
    <polygon points="-21,-36.3 -18,-27.3 -9,-27.3 -16,-22.3 -13,-13.3 -21,-18.3 -29,-13.3 -26,-22.3 -33,-27.3 -24,-27.3"/>
  </g>
  <!-- Text Underneath -->
  <text x="120" y="182" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="18" fill="#003399" text-anchor="middle">Co-funded by</text>
  <text x="120" y="210" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="20" fill="#003399" text-anchor="middle">the European Union</text>
</svg>
