<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%" height="100%">
  <!-- Speech Bubble Background -->
  <path d="M 75 110 
           L 360 110 
           A 20 20 0 0 1 380 130 
           L 380 230 
           A 20 20 0 0 1 360 250 
           L 140 250 
           L 100 285 
           L 105 250 
           L 75 250 
           A 20 20 0 0 1 55 230 
           L 55 130 
           A 20 20 0 0 1 75 110 Z" 
        fill="#072046" />

  <!-- SPEAK Text inside Speech Bubble -->
  <text x="215" y="212" 
        font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" 
        font-size="94" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="3" 
        transform="scale(0.96, 1.15) translate(9, -26)">SPEAK</text>

  <!-- UP Text with Up Arrow on 'U' -->
  <g fill="#E30613">
    <!-- Up Arrow head above U -->
    <path d="M 410 60 L 440 100 L 423 100 L 423 205 A 22 22 0 0 1 397 227 L 397 227 A 22 22 0 0 1 375 205 L 375 140 L 397 140 L 397 202 A 4 4 0 0 0 401 206 L 401 206 A 4 4 0 0 0 405 202 L 405 100 L 380 100 Z" />
    
    <!-- P Letter -->
    <text x="445" y="222" 
          font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" 
          font-size="125" 
          font-weight="900" 
          transform="scale(0.95, 1.1) translate(12, -18)">P</text>
  </g>

  <!-- AGAINST HATE Text -->
  <g font-family="'Impact', 'Arial Black', 'Trebuchet MS', sans-serif" font-size="64" font-weight="900" letter-spacing="1">
    <text x="110" y="340" fill="#E30613" transform="scale(0.98, 1.15) translate(2, -40)">AGAINST</text>
    <text x="382" y="340" fill="#072046" transform="scale(0.98, 1.15) translate(2, -40)">HATE</text>
  </g>

  <!-- Divider lines & WORDS MATTER -->
  <g stroke="#072046" stroke-width="4" stroke-linecap="round">
    <line x1="110" y1="365" x2="175" y2="365" />
    <line x1="425" y1="365" x2="490" y2="365" />
  </g>
  <text x="300" y="372" 
        font-family="'Plus Jakarta Sans', 'Arial', sans-serif" 
        font-size="20" 
        font-weight="800" 
        fill="#072046" 
        text-anchor="middle" 
        letter-spacing="5">WORDS MATTER</text>
</svg>
